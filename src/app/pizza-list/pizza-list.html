<h1>Liste des pizzas</h1>

<ul>
  @for (pizza of pizzasList(); track pizza.id) {
    <li>
      <hai-pizza-item
        [pizza]="pizza"
        (deletepizza)="supprimerPizza($event)"
        (deletecomment)="supprimercomment($event)">
      </hai-pizza-item>
    </li>
  }
</ul>

<h2>Liste des pizzas au format JSON</h2>

<pre>{{ pizzasList() | json }}</pre>
